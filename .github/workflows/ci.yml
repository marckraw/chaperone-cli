name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Self-check (Chaperone checks itself, including tsc)
        run: bun run src/cli.ts check

      - name: Build binary
        run: bun run build

      - name: Self-check with the compiled binary
        shell: bash
        run: |
          set -euo pipefail
          for binary in bin/chaperone-*; do
            "$binary" --version
            "$binary" check --format json > /dev/null
          done

      - name: The launcher in the compiled binary (download, verify, exec)
        shell: bash
        run: |
          set -euo pipefail
          for binary in bin/chaperone-*; do
            CHAPERONE_TEST_BINARY="$binary" bun test src/launcher/compiled.test.ts
          done
